global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: financial-pipeline
    static_configs:
      - targets: ["pipeline-exporter:8000"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
