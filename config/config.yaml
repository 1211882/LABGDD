  market_data_stream_url: "wss://stream.data.alpaca.markets/v2"
  test_stream_url: "wss://stream.data.alpaca.markets/v2/test"
  paper_trading_base_url: "https://paper-api.alpaca.markets/v2"
  feed: "iex"

