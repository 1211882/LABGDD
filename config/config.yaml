ingestion:
  start_date: "2026-09-01"
  end_date: "2026-09-20"
  timeframe: "1Min"
  limit: 10000

storage:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"

spark:
  app_name: "financial-market-batch"
  master: "local[*]"
  input_path: "data/raw"
  output_path: "data/processed/batch"
  invalid_output_path: "data/processed/invalid"
  metrics_path: "data/processed/batch_metrics.json"

kafka:
  bootstrap_servers: "localhost:9092"
  raw_topic: "market-bars-raw"
  dead_letter_topic: "market-bars-dlq"
  consumer_group: "market-bars-demo"
  client_id: "financial-market-pipeline"
  partitions: 6
  replication_factor: 1
  consumer_timeout_seconds: 15
